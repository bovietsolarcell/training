<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Hub — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ======== CONFIG — same values as index.html ======== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxqBF6Hpp5vYu99uyB1FRl7l7WrBzxHGF16k9TTgaVxElYO39GBF8vXq2nSxP3Irc0SLg/exec',
  GOOGLE_CLIENT_ID: '41999747735-oac5t510bbcp9p4n10hoo6cgkodmut74.apps.googleusercontent.com',
  ORG_NAME: 'Training Hub'
};
</script>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#1a2233;--muted:#5d6b82;--line:#e3e8ef;--brand:#0b5cad;--brand-2:#e8f1fb;
--ok:#1f8a4c;--ok-2:#e5f5ec;--warn:#b26a00;--warn-2:#fdf3e1;--bad:#c0392b;--bad-2:#fbeaea;--r:10px;
--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
header{background:#0f1f36;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header .brand{font-weight:700;display:flex;align-items:center;gap:10px}
header nav{display:flex;gap:4px}
header nav button{background:none;border:0;color:#c9d4e5;padding:6px 12px;border-radius:6px}
header nav button.active,header nav button:hover{background:rgba(255,255,255,.12);color:#fff}
header .who{margin-left:auto;font-size:13px;color:#c9d4e5;display:flex;gap:10px;align-items:center}
header .who button{background:none;border:1px solid #2d4b78;color:#c9d4e5;border-radius:6px;padding:3px 10px;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:24px 20px 100px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.center{max-width:440px;margin:50px auto;text-align:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#b7c2d1}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover:not(:disabled){background:#094c8f}
.btn.danger{color:var(--bad)}.btn.sm{padding:3px 9px;font-size:12px}.btn.icon{padding:3px 8px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>.field{flex:1;min-width:140px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--brand-2);border-color:var(--brand)}
.hint{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--brand-2);color:var(--brand)}
.pill.ok{background:var(--ok-2);color:var(--ok)}.pill.bad{background:var(--bad-2);color:var(--bad)}.pill.gray{background:#eef1f5;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
.tabs .n{background:#eef1f5;color:var(--muted);border-radius:99px;font-size:11px;padding:0 7px;margin-left:4px}
.item{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:12px}
.item-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfd;border-radius:var(--r) var(--r) 0 0}
.item-head .num{background:var(--brand);color:#fff;border-radius:6px;font-size:12px;font-weight:700;padding:1px 8px}
.item-head .grow{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-body{padding:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.preview{border:1px dashed var(--line);border-radius:8px;padding:12px;background:#fcfdff;min-height:120px;overflow:auto;max-height:520px}
.preview img{max-width:100%}
.video{position:relative;padding-top:56.25%;margin-bottom:10px;border-radius:8px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.opt-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.opt-row .key{width:26px;height:26px;border-radius:50%;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.opt-row.correct .key{background:var(--ok);color:#fff}
.opt-row input[type=text]{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.opt-row.correct input[type=text]{border-color:var(--ok);background:var(--ok-2)}
.opt-row label{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center;white-space:nowrap;cursor:pointer}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;align-items:center;justify-content:flex-end;z-index:4;box-shadow:0 -2px 8px rgba(16,24,40,.06)}
.savebar .msg{margin-right:auto;color:var(--muted);font-size:13px}
.savebar .msg.dirty{color:var(--warn);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat .n{font-size:24px;font-weight:700}.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(15,31,54,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#0f1f36;color:#fff;padding:9px 16px;border-radius:8px;z-index:30}
.qr{display:flex;justify-content:center;padding:10px}
.url{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f3f5f8;padding:6px 8px;border-radius:6px;word-break:break-all}
#gbtn{display:flex;justify-content:center;margin:16px 0}
@media(max-width:860px){.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header nav{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg width="26" height="26" viewBox="0 0 28 28"><rect width="28" height="28" rx="7" fill="#0b5cad"/><path d="M7 11l7-4 7 4-7 4-7-4z" fill="#fff"/><path d="M10 13v4c0 1.5 2 3 4 3s4-1.5 4-3v-4" stroke="#fff" stroke-width="1.6" fill="none"/></svg><span id="orgName"></span> · Admin</div>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
</header>
<main id="main"></main>
<div id="modal"></div>

<script>
/* =================== State & helpers =================== */
const S = { idToken: null, me: null, view: 'courses', courses: [], edit: null, isNew: false, tab: 'info', dirty: false,
            courseId: null, links: [], results: null, depts: [], resFilter: '' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = iso => iso ? new Date(iso).toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'}) : '—';
const KEYS = ['A', 'B', 'C', 'D'];
$('#orgName').textContent = CONFIG.ORG_NAME;

async function api(action, payload = {}) {
  const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, idToken: S.idToken, ...payload}) });
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.message); e.code = j.code; throw e; }
  return j.data;
}
function fail(e) {
  if (e.code === 'AUTH') { signOut(); return; }
  if (e.code === 'FORBIDDEN') { render(`<div class="card center"><div style="font-size:36px">🔒</div><h1>No admin access</h1><p class="sub">${esc(e.message)}</p><button class="btn" onclick="signOut()">Sign in with another account</button></div>`); return; }
  alertModal('Error', e.message || 'Network error.');
}
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function render(html) { $('#main').innerHTML = html; }
const loading = m => `<div class="center"><div class="spinner"></div><div class="hint">${esc(m || 'Loading…')}</div></div>`;
function alertModal(title, msg) {
  $('#modal').innerHTML = `<div class="modal-bg"><div class="modal"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div style="text-align:right"><button class="btn primary" id="mOk">OK</button></div></div></div>`;
  $('#mOk').onclick = () => $('#modal').innerHTML = '';
}
function confirmModal(title, msg, yes, label = 'Confirm') {
  $('#modal').innerHTML = `<div class="modal-bg"><div class="modal"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">${esc(label)}</button></div></div></div>`;
  $('#mNo').onclick = () => $('#modal').innerHTML = '';
  $('#mYes').onclick = () => { $('#modal').innerHTML = ''; yes(); };
}
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copied'); } catch { toast('Copy failed — select and copy manually'); } }

/* ---- same renderers as index.html (for preview) ---- */
const DRIVE_ID = /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/;
function videoEmbed(cell) {
  return String(cell || '').split(/[\n,]+/).map(s => s.trim()).filter(Boolean).map(url => {
    let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
    if (m) return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0" allowfullscreen></iframe></div>`;
    m = url.match(DRIVE_ID);
    if (m) return `<div class="video"><iframe src="https://drive.google.com/file/d/${m[1]}/preview" allowfullscreen></iframe></div>`;
    if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return `<video src="${esc(url)}" controls style="width:100%;border-radius:8px;margin-bottom:10px"></video>`;
    return `<p><a href="${esc(url)}" target="_blank" rel="noopener">▶ ${esc(url)}</a></p>`;
  }).join('');
}
function lessonContent(raw) {
  let s = String(raw || '');
  const driveImg = id => `https://lh3.googleusercontent.com/d/${id}`;
  if (!/<[a-z][\s\S]*>/i.test(s)) {
    s = s.split(/\n\s*\n/).map(block => {
      const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
      if (!lines.length) return '';
      if (lines.length === 1 && /^https?:\/\/\S+$/i.test(lines[0])) {
        const u = lines[0], d = u.match(DRIVE_ID);
        if (d || /\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(u)) return `<img src="${esc(d ? driveImg(d[1]) : u)}" alt="" style="max-width:100%;border-radius:8px;margin:6px 0">`;
      }
      if (lines.every(l => /^[-*•]\s+/.test(l))) return `<ul>${lines.map(l => `<li>${esc(l.replace(/^[-*•]\s+/, ''))}</li>`).join('')}</ul>`;
      return `<p>${lines.map(esc).join('<br>')}</p>`;
    }).join('');
  }
  return s.replace(/(<img[^>]+src=["'])([^"']+)(["'])/gi, (all, a, url, b) => { const d = url.match(DRIVE_ID); return d ? a + driveImg(d[1]) + b : all; });
}

/* =================== Auth =================== */
function jwtPayload(t) { try { return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))))); } catch { return null; } }
function tokenValid(t) { const p = t && jwtPayload(t); return p && p.exp * 1000 > Date.now() + 60000; }
async function showSignIn(msg) {
  $('#nav').innerHTML = ''; $('#who').innerHTML = '';
  render(`<div class="card center"><div style="font-size:36px">🛠️</div><h1>Training Admin</h1>
    <p class="sub">Sign in with an administrator Google account to manage courses.</p><div id="gbtn"></div><div style="color:var(--bad)">${esc(msg || '')}</div></div>`);
  for (let i = 0; i < 100 && !window.google?.accounts?.id; i++) await new Promise(r => setTimeout(r, 100));
  if (!window.google?.accounts?.id) return alertModal('Error', 'Could not load Google Sign-In.');
  google.accounts.id.initialize({client_id: CONFIG.GOOGLE_CLIENT_ID, callback: r => { S.idToken = r.credential; try { sessionStorage.setItem('th_admin_tok', S.idToken); } catch {} start(); }, auto_select: true});
  google.accounts.id.renderButton($('#gbtn'), {theme: 'filled_blue', size: 'large', shape: 'pill'});
}
function signOut() {
  S.idToken = null; try { sessionStorage.removeItem('th_admin_tok'); } catch {}
  try { google.accounts.id.disableAutoSelect(); } catch {}
  showSignIn();
}
async function start() {
  render(loading('Checking access…'));
  try {
    S.me = await api('adminMe');
    $('#who').innerHTML = `<span>${esc(S.me.email)}</span><button onclick="signOut()">Sign out</button>`;
    drawNav(); go('courses');
  } catch (e) { fail(e); }
}
function drawNav() {
  $('#nav').innerHTML = [['courses', '📚 Courses'], ['depts', '🏢 Departments']]
    .map(([v, l]) => `<button data-nav="${v}" class="${S.view === v || (v === 'courses' && ['editor','links','results'].includes(S.view)) ? 'active' : ''}">${l}</button>`).join('');
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => guard(() => go(b.dataset.nav)));
}
function guard(fn) { if (S.view === 'editor' && S.dirty) confirmModal('Discard changes?', 'You have unsaved changes to this course.', () => { S.dirty = false; fn(); }, 'Discard'); else fn(); }
window.addEventListener('beforeunload', e => { if (S.view === 'editor' && S.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* =================== Router =================== */
async function go(view, arg) {
  S.view = view; drawNav(); window.scrollTo(0, 0);
  try {
    if (view === 'courses') { render(loading()); S.courses = await api('adminListCourses'); viewCourses(); }
    else if (view === 'editor') {
      S.tab = 'info'; S.dirty = false;
      if (arg) { render(loading('Loading course…')); S.edit = await api('adminGetCourse', {courseId: arg}); S.isNew = false; }
      else { S.isNew = true; S.edit = {courseId: '', title: '', category: '', description: '', durationMin: 30, passScore: 80, timeLimitMin: 0, maxAttempts: 3, active: true,
             lessons: [{title: '', content: '', videoUrl: ''}], questions: [{question: '', options: ['', '', '', ''], correct: 'A'}]}; }
      viewEditor();
    }
    else if (view === 'links') { S.courseId = arg; render(loading()); S.links = await api('adminListLinks', {courseId: arg}); viewLinks(); }
    else if (view === 'results') { S.courseId = arg; S.resFilter = ''; render(loading()); S.results = await api('adminResults', {courseId: arg}); viewResults(); }
    else if (view === 'depts') { render(loading()); S.depts = await api('adminGetDepartments'); viewDepts(); }
  } catch (e) { fail(e); }
}
const courseTitle = id => (S.courses.find(c => c.courseId === id) || {}).title || (S.edit && S.edit.courseId === id && S.edit.title) || id;

/* =================== Courses list =================== */
function viewCourses() {
  const cs = S.courses;
  render(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
    <div><h1>Courses</h1><p class="sub">${cs.length} course(s). Create a course, add lessons and a quiz, then share a link.</p></div>
    <button class="btn primary" id="newBtn">+ New course</button></div>
    <div class="card" style="padding:0;overflow:auto">${cs.length ? `<table>
      <tr><th>Course</th><th>Lessons</th><th>Questions</th><th>Active links</th><th>Learners</th><th>Passed</th><th>Status</th><th></th></tr>
      ${cs.map(c => `<tr><td><b>${esc(c.title)}</b><div class="hint">${esc(c.courseId)}${c.category ? ' · ' + esc(c.category) : ''}</div></td>
        <td>${c.lessons}</td><td>${c.questions}</td><td>${c.activeLinks}</td><td>${c.learners}</td><td>${c.passed}</td>
        <td>${c.active ? '<span class="pill ok">Active</span>' : '<span class="pill gray">Archived</span>'}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn sm" data-edit="${esc(c.courseId)}">✏️ Edit</button>
          <button class="btn sm" data-links="${esc(c.courseId)}" ${c.active ? '' : 'disabled'}>🔗 Links</button>
          <button class="btn sm" data-results="${esc(c.courseId)}">📊 Results</button></td></tr>`).join('')}</table>`
      : '<div class="center"><p class="sub">No courses yet.</p></div>'}</div>`);
  $('#newBtn').onclick = () => go('editor');
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => go('editor', b.dataset.edit));
  document.querySelectorAll('[data-links]').forEach(b => b.onclick = () => go('links', b.dataset.links));
  document.querySelectorAll('[data-results]').forEach(b => b.onclick = () => go('results', b.dataset.results));
}

/* =================== Course editor =================== */
function markDirty() { S.dirty = true; const m = $('#saveMsg'); if (m) { m.textContent = '● Unsaved changes'; m.className = 'msg dirty'; } }
function viewEditor() {
  const c = S.edit;
  render(`<button class="btn sm" id="backBtn" style="margin-bottom:12px">← All courses</button>
    <h1>${S.isNew ? 'New course' : esc(c.title)}</h1><p class="sub">${S.isNew ? 'Step 1: course info → Step 2: lessons → Step 3: quiz → Save.' : 'Course ID: ' + esc(c.courseId)}</p>
    <div class="tabs">
      <button data-tab="info" class="${S.tab === 'info' ? 'active' : ''}">1. Course info</button>
      <button data-tab="lessons" class="${S.tab === 'lessons' ? 'active' : ''}">2. Lessons <span class="n">${c.lessons.length}</span></button>
      <button data-tab="quiz" class="${S.tab === 'quiz' ? 'active' : ''}">3. Quiz <span class="n">${c.questions.length}</span></button>
    </div>
    <div id="tabBody"></div>
    <div class="savebar"><span class="msg ${S.dirty ? 'dirty' : ''}" id="saveMsg">${S.dirty ? '● Unsaved changes' : S.isNew ? 'Not saved yet' : 'All changes saved'}</span>
      ${S.tab !== 'info' ? `<button class="btn" id="prevTab">← Back</button>` : ''}
      ${S.tab !== 'quiz' ? `<button class="btn" id="nextTab">Next →</button>` : ''}
      <button class="btn primary" id="saveBtn">💾 Save course</button></div>`);
  $('#backBtn').onclick = () => guard(() => go('courses'));
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; viewEditor(); });
  const order = ['info', 'lessons', 'quiz'];
  if ($('#prevTab')) $('#prevTab').onclick = () => { S.tab = order[order.indexOf(S.tab) - 1]; viewEditor(); window.scrollTo(0, 0); };
  if ($('#nextTab')) $('#nextTab').onclick = () => { S.tab = order[order.indexOf(S.tab) + 1]; viewEditor(); window.scrollTo(0, 0); };
  $('#saveBtn').onclick = saveCourse;
  ({info: tabInfo, lessons: tabLessons, quiz: tabQuiz})[S.tab]();
}
function bindInputs(root, obj) {
  root.querySelectorAll('[data-f]').forEach(el => {
    const k = el.dataset.f, ev = el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => { obj[k] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value; markDirty(); });
  });
}
function tabInfo() {
  const c = S.edit;
  $('#tabBody').innerHTML = `<div class="card">
    <div class="row">
      <div class="field" style="flex:2"><label>Course title *</label><input data-f="title" value="${esc(c.title)}" placeholder="e.g. Workplace Safety Fundamentals"></div>
      <div class="field"><label>Course ID * ${S.isNew ? '' : '(cannot change)'}</label><input data-f="courseId" id="cid" value="${esc(c.courseId)}" ${S.isNew ? '' : 'disabled'} placeholder="e.g. SAFE101" maxlength="30"></div>
      <div class="field"><label>Category</label><input data-f="category" value="${esc(c.category)}" placeholder="Safety, Quality, Production…" list="cats"></div>
    </div>
    <datalist id="cats">${['Safety','Quality','Production','Onboarding','Maintenance','IT','Compliance'].map(x => `<option>${x}</option>`).join('')}</datalist>
    <div class="field"><label>Description</label><textarea data-f="description" rows="3" placeholder="What learners will get from this course">${esc(c.description)}</textarea></div>
    <div class="row">
      <div class="field"><label>Estimated duration (min)</label><input type="number" min="0" data-f="durationMin" value="${c.durationMin}"></div>
      <div class="field"><label>Pass score (%)</label><input type="number" min="0" max="100" data-f="passScore" value="${c.passScore}"></div>

function updateCounts() { const n = document.querySelectorAll('.tabs .n'); n[0].textContent = S.edit.lessons.length; n[1].textContent = S.edit.questions.length; }
function insertAtCursor(i, text) {
  const ta = document.querySelector(`.item[data-i="${i}"] [data-f=content]`);
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.dispatchEvent(new Event('input', {bubbles: true})); ta.focus();
}
function formatText(i, kind) {
  const ta = document.querySelector(`.item[data-i="${i}"] [data-f=content]`);
  const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
  if (kind === 'bullet') {
    const pre = s > 0 && ta.value[s - 1] !== '\n' ? '\n' : '';
    ta.setSelectionRange(s, e); insertAtCursor(i, pre + (sel ? sel.split('\n').map(l => '- ' + l.replace(/^[-*•]\s+/, '')).join('\n') : '- '));
  } else if (kind === 'bold') {
    if (!/<[a-z]/i.test(ta.value) && ta.value.trim()) return alertModal('Bold text', 'Bold uses HTML. To keep it simple, bold is only available in an empty lesson or one already written in HTML (e.g. <p>…</p>). Tip: use bullet points or short headings instead.');
    insertAtCursor(i, `<b>${sel || 'bold text'}</b>`);
  }
}
async function resizeImage(file) {
  if (file.type === 'image/gif') return {blob: file, type: 'image/gif'};
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  const type = file.type === 'image/png' && file.size < 1.5e6 ? 'image/png' : 'image/jpeg';
  const blob = await new Promise(r => cv.toBlob(r, type, 0.85));
  return {blob, type};
}
async function uploadImage(i, file) {
  if (!file) return;
  const msg = document.querySelector(`[data-upmsg="${i}"]`);
  if (!/^image\//.test(file.type)) return alertModal('Not an image', 'Please choose a PNG, JPG, GIF or WEBP file.');
  msg.textContent = 'Uploading…';
  try {
    const {blob, type} = await resizeImage(file);
    if (blob.size > 8e6) throw new Error('Image is still larger than 8 MB after resizing.');
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
    const r = await api('adminUploadImage', {fileName: file.name, mimeType: type, dataBase64: b64});
    insertAtCursor(i, `\n\n${r.url}\n\n`);
    msg.textContent = '✓ Image added';
  } catch (e) { msg.textContent = ''; fail(e); }
}

let uploading = 0;
/** Video: Apps Script opens a Drive resumable session; the browser uploads the file straight to Drive. */
async function uploadVideo(i, file) {
  if (!file) return;
  const msg = document.querySelector(`[data-vmsg="${i}"]`), bar = document.querySelector(`[data-vbar="${i}"]`), fill = bar.firstElementChild;
  if (!/^video\//.test(file.type)) return alertModal('Not a video', 'Please choose a video file (MP4, MOV, WEBM…).');
  if (file.size > 2 * 1024 ** 3) return alertModal('Video too large', 'Maximum 2 GB. For long videos, YouTube (Unlisted) is a better choice.');
  const mb = (file.size / 1048576).toFixed(1);
  msg.textContent = `Preparing upload (${mb} MB)…`; bar.style.display = 'block'; fill.style.width = '0';
  uploading++;
  try {
    const {uploadUrl} = await api('adminStartVideoUpload', {fileName: file.name, mimeType: file.type, size: file.size, origin: location.origin});
    const fileId = await new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      x.open('PUT', uploadUrl);
      x.setRequestHeader('Content-Type', file.type);
      x.upload.onprogress = e => { if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); fill.style.width = p + '%'; msg.textContent = `Uploading… ${p}% of ${mb} MB — keep this page open`; } };
      x.onload = () => { if (x.status === 200 || x.status === 201) { try { resolve(JSON.parse(x.responseText).id); } catch { reject(new Error('Unexpected response from Drive.')); } } else reject(new Error(`Drive upload failed (${x.status}).`)); };
      x.onerror = () => reject(new Error('Network error during upload. Please try again.'));
      x.send(file);
    });
    msg.textContent = 'Sharing…';
    const r = await api('adminFinishUpload', {fileId});
    const lesson = S.edit.lessons[i];
    if (lesson) { lesson.videoUrl = (lesson.videoUrl.trim() ? lesson.videoUrl.trim() + '\n' : '') + r.url; markDirty(); }
    const ta = document.querySelector(`.item[data-i="${i}"] [data-f=videoUrl]`);
    if (ta && lesson) { ta.value = lesson.videoUrl; ta.dispatchEvent(new Event('input', {bubbles: true})); }
    fill.style.width = '100%';
    msg.textContent = '✓ Video added. Drive may need a few minutes to process it before it plays.';
  } catch (e) { msg.textContent = ''; bar.style.display = 'none'; fail(e); }
  finally { uploading--; }
}
window.addEventListener('beforeunload', e => { if (uploading) { e.preventDefault(); e.returnValue = ''; } });

/* ---- Save ---- */
function validateLocal(c) {
  if (!c.title.trim()) return ['info', 'Course title is required.'];
  if (!/^[A-Za-z0-9_-]{2,30}$/.test(c.courseId)) return ['info', 'Course ID must be 2–30 characters: letters, numbers, - or _.'];
  for (let i = 0; i < c.lessons.length; i++) if (!c.lessons[i].title.trim()) return ['lessons', `Lesson ${i + 1} needs a title.`];
  for (let i = 0; i < c.questions.length; i++) {
    const q = c.questions[i], o = q.options.map(x => x.trim());
    if (!q.question.trim()) return ['quiz', `Question ${i + 1} is empty.`];
    if (o.filter(Boolean).length < 2) return ['quiz', `Question ${i + 1} needs at least 2 options.`];
    if (!o[KEYS.indexOf(q.correct)]) return ['quiz', `Question ${i + 1}: the correct answer (${q.correct}) is empty.`];
  }
  return null;
}
async function saveCourse() {
  const c = S.edit, err = validateLocal(c);
  if (err) { S.tab = err[0]; viewEditor(); return alertModal('Please fix', err[1]); }
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await api('adminSaveCourse', {course: c, isNew: S.isNew});
    const wasNew = S.isNew; S.isNew = false; S.dirty = false;
    viewEditor(); toast('Course saved');
    if (wasNew) confirmModal('Course created 🎉', 'Do you want to create a share link for learners now?', () => go('links', c.courseId), 'Create link');
  } catch (e) { btn.disabled = false; btn.textContent = '💾 Save course'; fail(e); }
}

  $('#rDept').onchange = e => { S.resFilter = e.target.value; viewResults(); };
  $('#rRefresh').onclick = () => go('results', S.courseId);
  $('#rCsv').onclick = () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    copy([['Name', 'Email', 'Department', 'Lessons done', 'Study minutes', 'Attempts', 'Best score', 'Passed', 'Passed at'].map(q).join(',')]
      .concat(rows.map(r => [r.fullName, r.email, r.department, `${r.lessonsDone}/${R.lessonCount}`, Math.round(r.secondsSpent / 60), r.attempts, r.bestScore ?? '', r.passed ? 'Yes' : 'No', r.passedAt || ''].map(q).join(','))).join('\n'));
  };
}

/* =================== Departments =================== */
function viewDepts() {
  render(`<h1>Departments</h1><p class="sub">Learners choose one of these after signing in. One department per line.</p>
    <div class="card" style="max-width:520px"><div class="field"><textarea id="dList" rows="12">${esc(S.depts.join('\n'))}</textarea></div>
    <button class="btn primary" id="dSave">Save departments</button></div>`);
  $('#dSave').onclick = async () => {
    const b = $('#dSave'); b.disabled = true;
    try { S.depts = await api('adminSaveDepartments', {departments: $('#dList').value.split('\n')}); viewDepts(); toast('Departments saved'); }
    catch (e) { b.disabled = false; fail(e); }
  };
}

/* =================== Boot =================== */
(function boot() {
  if (CONFIG.API_URL.includes('XXXX') || CONFIG.GOOGLE_CLIENT_ID.includes('XXXX')) return render('<div class="card center"><h1>Not configured</h1><p class="sub">Set API_URL and GOOGLE_CLIENT_ID at the top of admin.html.</p></div>');
  let t = null; try { t = sessionStorage.getItem('th_admin_tok'); } catch {}
  if (tokenValid(t)) { S.idToken = t; start(); } else showSignIn();
})();
</script>
</body>
</html>
