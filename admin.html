<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Hub — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ======== CONFIG — same values as index.html ======== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxqBF6Hpp5vYu99uyB1FRl7l7WrBzxHGF16k9TTgaVxElYO39GBF8vXq2nSxP3Irc0SLg/exec',
  GOOGLE_CLIENT_ID: '41999747735-oac5t510bbcp9p4n10hoo6cgkodmut74.apps.googleusercontent.com',
  ORG_NAME: 'Boviet Solar Training'
};
</script>
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--ink:#0f172a;--ink-2:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e6e9f0;--line-2:#eef1f6;
  --brand:#1d4ed8;--brand-600:#2563eb;--brand-50:#eef4ff;--brand-100:#dbe7ff;
  --ok:#16a34a;--ok-50:#ecfdf3;--warn:#d97706;--warn-50:#fff7e8;--bad:#dc2626;--bad-50:#fef2f2;
  --side:#0b1b33;--r:14px;--r-sm:10px;
  --sh-1:0 1px 2px rgba(15,23,42,.05);--sh-2:0 1px 3px rgba(15,23,42,.06),0 6px 18px -6px rgba(15,23,42,.10);--sh-3:0 12px 32px -8px rgba(15,23,42,.22);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:linear-gradient(to right,var(--side) 232px,transparent 232px)}
.side{background:var(--side);color:#cbd5e1;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:15px;padding:4px 10px 22px}
.logo small{display:block;font-weight:500;font-size:11px;color:#8aa0c0;letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:none;color:#cbd5e1;text-align:left;width:100%;font-weight:500}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}.nav.active{background:rgba(255,255,255,.1);color:#fff}
.nav svg{width:18px;height:18px;opacity:.9}
.me{margin-top:auto;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:12px}
.me b{display:block;color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.me button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.18);color:#cbd5e1;border-radius:8px;padding:4px 10px;font-size:12px}
.main{min-width:0}
.page{max-width:1240px;margin:0 auto;padding:28px 32px 120px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:16px;font-weight:700;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;background:none;border:0;padding:0;margin-bottom:10px}
.crumb:hover{color:var(--brand)}
/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap;transition:.15s;box-shadow:var(--sh-1)}
.btn:hover:not(:disabled){border-color:#cfd6e3;background:#fafbfd}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover:not(:disabled){background:#1e40af}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}.btn.ghost:hover:not(:disabled){background:var(--line-2)}
.btn.soft{background:var(--brand-50);border-color:var(--brand-50);color:var(--brand);box-shadow:none}.btn.soft:hover:not(:disabled){background:var(--brand-100)}
.btn.danger{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn.icon{padding:6px;width:32px;justify-content:center}
.btn svg{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.pad{padding:20px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--line-2);color:var(--muted)}
.badge.ok{background:var(--ok-50);color:var(--ok)}.badge.warn{background:var(--warn-50);color:var(--warn)}.badge.bad{background:var(--bad-50);color:var(--bad)}.badge.brand{background:var(--brand-50);color:var(--brand)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;transition:.15s}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--brand-600);box-shadow:0 0 0 4px var(--brand-50)}
.textarea{resize:vertical;line-height:1.6}
.label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.help{font-size:12px;color:var(--muted);margin-top:6px}
.field{margin-bottom:18px}
.seg{display:inline-flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:600;font-size:12px;color:var(--ink-2);transition:.15s}
.chip:hover{border-color:#cfd6e3}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.search{position:relative}.search input{padding-left:36px;min-width:260px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;color:var(--faint)}
.switch{position:relative;width:40px;height:22px;flex:none}.switch input{display:none}
.switch span{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:var(--sh-1)}
.switch input:checked+span{background:var(--ok)}.switch input:checked+span::after{left:20px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ill{font-size:40px;margin-bottom:8px}
/* ---------- course grid ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.course{display:flex;flex-direction:column;cursor:pointer;transition:.18s;overflow:hidden;position:relative}
.course:hover{box-shadow:var(--sh-2);transform:translateY(-2px);border-color:#d6dce8}
.course .band{height:6px}
.course .top{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.course .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.course .cat{font-size:12px;font-weight:600;color:var(--muted)}
.course .title{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:12px 18px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.course .desc{color:var(--muted);font-size:13px;margin:0 18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.course .meta{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:14px 18px 0}
.course .meta span{display:inline-flex;align-items:center;gap:5px}
.course .prog{margin:16px 18px 0;padding:12px;border-radius:12px;background:#f8fafc}
.course .prog .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.course .prog .row b{color:var(--ink)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.course .foot{display:flex;align-items:center;gap:6px;padding:14px 18px 16px;margin-top:auto}
.course .foot .sp{flex:1;font-size:11px;color:var(--faint)}
.newcard{border:2px dashed #cfd6e3;background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;min-height:330px;color:var(--muted);font-weight:600;cursor:pointer;transition:.15s;border-radius:var(--r)}
.newcard:hover{border-color:var(--brand-600);color:var(--brand);background:var(--brand-50)}
.newcard .plus{width:48px;height:48px;border-radius:14px;background:var(--brand-50);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:26px}
.menu{position:absolute;right:14px;bottom:52px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-3);padding:6px;z-index:6;min-width:170px}
.menu button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-weight:500}
.menu button:hover{background:var(--line-2)}
/* ---------- dashboard ---------- */
.dhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.dhead .ico{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.dhead .grow{flex:1;min-width:240px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.tabs .n{background:var(--line-2);border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.panel{padding:18px 20px}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:10px}
.panel .ph span{font-size:12px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:140px 1fr 70px;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}
.hbar .nm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:10px;background:var(--line-2);border-radius:99px;overflow:hidden;display:flex}
.hbar .track i{display:block;height:100%}
.hbar .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.hbar .val b{color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px;border-bottom:1px solid var(--line)}
.cols .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.cols .col i{display:block;width:100%;max-width:46px;border-radius:8px 8px 3px 3px;min-height:3px}
.cols .col span{font-size:12px;font-weight:700}
.collab{display:flex;gap:10px}.collab div{flex:1;text-align:center;font-size:11px;color:var(--muted);padding-top:6px}
.spark{width:100%;height:150px;display:block}
.qrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.qrow:last-child{border-bottom:0}
.qrow .qn{width:30px;height:30px;border-radius:9px;background:var(--line-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.qrow .qt{flex:1;min-width:0;font-size:13px}
.qrow .qt div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .pct{font-weight:700;font-variant-numeric:tabular-nums;width:48px;text-align:right}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:13px}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:#fafbfd}
tr:last-child td{border-bottom:0}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.who{display:flex;gap:10px;align-items:center}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.url{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f3f5f9;padding:8px 10px;border-radius:8px;word-break:break-all;color:var(--ink-2)}
/* ---------- builder ---------- */
.bshell{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
.btop{position:sticky;top:0;z-index:5;background:rgba(244,246,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 24px}
.btop .t{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline{border-right:1px solid var(--line);background:#fff;padding:16px 12px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
.osec{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.oitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left;font-weight:500;color:var(--ink-2);position:relative}
.oitem:hover{background:var(--line-2)}.oitem.on{background:var(--brand-50);color:var(--brand);font-weight:600}
.oitem .num{width:24px;height:24px;border-radius:7px;background:var(--line-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;color:var(--muted)}
.oitem.on .num{background:var(--brand);color:#fff}
.oitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oitem .st{width:8px;height:8px;border-radius:50%;flex:none}
.oitem .st.ok{background:var(--ok)}.oitem .st.todo{background:#f59e0b}
.oitem .mv{display:none;gap:2px}.oitem:hover .mv{display:flex}
.oitem .mv span{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.oitem .mv span:hover{background:#fff;color:var(--ink)}
.oadd{display:flex;align-items:center;gap:8px;width:100%;border:1px dashed #cfd6e3;background:none;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:600;margin-top:6px}
.oadd:hover{border-color:var(--brand-600);color:var(--brand);background:var(--brand-50)}
.check{margin:18px 6px 0;padding:12px;border-radius:12px;background:#f8fafc;font-size:12px;color:var(--muted)}
.check div{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.editor{padding:28px 40px 120px;max-width:940px;width:100%;margin:0 auto}
.ebig{font-size:22px;font-weight:700;border:0;background:transparent;width:100%;padding:6px 0;border-bottom:2px solid transparent;letter-spacing:-.01em}
.ebig:focus{outline:none;border-bottom-color:var(--brand-100)}
.ebig::placeholder{color:#c0c8d6}
.drop{border:2px dashed #cfd6e3;border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);transition:.15s;background:#fff;cursor:pointer}
.drop.over,.drop:hover{border-color:var(--brand-600);background:var(--brand-50);color:var(--brand)}
.drop b{color:var(--ink)}
.media{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px}
.mitem .k{width:30px;height:30px;border-radius:8px;background:var(--line-2);display:flex;align-items:center;justify-content:center;flex:none}
.mitem .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.upl{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--brand-50);font-size:12px;color:var(--brand)}
.upl .bar{margin-top:6px;background:#fff}.upl .bar i{background:var(--brand-600);transition:width .2s}
.writer{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.writer .wt{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line-2);background:#fafbfd}
.writer textarea{border:0;width:100%;min-height:300px;padding:16px 18px;resize:vertical;line-height:1.7;outline:none}
.prev{padding:16px 20px;min-height:300px;line-height:1.7}
.prev img{max-width:100%;border-radius:10px}
.video{position:relative;padding-top:56.25%;margin-bottom:12px;border-radius:10px;overflow:hidden;background:#0f172a}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.qcard{padding:18px 20px;margin-bottom:14px}
.qcard .qh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qcard .qh .qn{background:var(--brand-50);color:var(--brand);font-weight:700;font-size:12px;padding:3px 9px;border-radius:7px}
.qcard .qh .sp{flex:1}
.qtext{border:0;width:100%;font-size:15px;font-weight:600;resize:none;padding:4px 0;line-height:1.5;outline:none;background:transparent}
.qtext::placeholder{color:#c0c8d6}
.opt{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;border:1px solid var(--line);border-radius:12px;margin-top:8px;transition:.15s;background:#fff}
.opt.correct{border-color:#86d9a5;background:var(--ok-50)}
.opt .mark{width:30px;height:30px;border-radius:50%;border:2px solid #cfd6e3;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--muted);flex:none;transition:.15s}
.opt .mark:hover{border-color:var(--ok);color:var(--ok)}
.opt.correct .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.opt input{flex:1;border:0;background:transparent;padding:6px 2px;outline:none}
.opt .rm{opacity:0;border:0;background:none;color:var(--faint);padding:4px 6px;border-radius:6px}
.opt:hover .rm{opacity:1}.opt .rm:hover{color:var(--bad);background:var(--bad-50)}
.addopt{border:0;background:none;color:var(--brand);font-weight:600;font-size:12px;padding:8px 6px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rule{padding:16px}
.rule .rl{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:10px;display:flex;justify-content:space-between}
.rule .rl b{color:var(--brand);font-size:14px}
input[type=range]{width:100%;accent-color:var(--brand)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-50);color:#92400e;font-size:13px;margin-bottom:18px}
/* ---------- overlays ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fade .15s}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:24px;max-height:92vh;overflow:auto;box-shadow:var(--sh-3);animation:pop .18s}
.modal h2{font-size:18px;margin-bottom:6px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.97);opacity:0}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;box-shadow:var(--sh-3);font-weight:500;animation:pop .18s}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{padding:90px 0;text-align:center;color:var(--muted)}
.signin{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 10% -10%,#dbe7ff,transparent),radial-gradient(900px 500px at 110% 110%,#e9ddff,transparent),var(--bg)}
.signin .box{background:#fff;border-radius:22px;box-shadow:var(--sh-3);padding:40px 36px;max-width:400px;width:100%;text-align:center}
#gbtn{display:flex;justify-content:center;margin:22px 0 8px}
.qrbox{display:flex;justify-content:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:14px auto;width:max-content}
@media(max-width:1100px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.logo{padding:4px 10px}.me{display:none}
  .page{padding:20px 16px 100px}.bshell{grid-template-columns:1fr}.outline{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.editor{padding:20px 16px 100px}.rules{grid-template-columns:1fr}.hbar{grid-template-columns:90px 1fr 60px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
/* =================================================================
   State, helpers
================================================================= */
const S = { idToken: null, me: null, route: 'courses', courses: [], filter: 'all', q: '',
  courseId: null, dtab: 'overview', results: null, links: [], lq: '', ldept: '', lstatus: '',
  edit: null, isNew: false, sel: 'settings', dirty: false, wmode: 'write', depts: [] };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEYS = ['A', 'B', 'C', 'D'];
const CATS = {
  Safety: {icon: '🦺', c: '#ef4444', bg: '#fef2f2'}, Quality: {icon: '🔍', c: '#2563eb', bg: '#eff6ff'},
  Production: {icon: '🏭', c: '#16a34a', bg: '#f0fdf4'}, Onboarding: {icon: '👋', c: '#7c3aed', bg: '#f5f3ff'},
  Maintenance: {icon: '🔧', c: '#d97706', bg: '#fffbeb'}, IT: {icon: '💻', c: '#0891b2', bg: '#ecfeff'},
  Compliance: {icon: '📋', c: '#475569', bg: '#f1f5f9'}
};
const cat = name => CATS[name] || {icon: '📘', c: '#64748b', bg: '#f1f5f9'};
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'}) : '—';
const fmtDT = iso => iso ? new Date(iso).toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'}) : '—';
function ago(iso) {
  if (!iso) return 'No activity yet';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return `Active ${Math.max(1, Math.round(s / 60))}m ago`;
  if (s < 86400) return `Active ${Math.round(s / 3600)}h ago`;
  if (s < 86400 * 30) return `Active ${Math.round(s / 86400)}d ago`;
  return 'Active ' + fmtDate(iso);
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const mins = s => !s ? '—' : s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`;
const initials = n => String(n || '?').trim().split(/\s+/).map(x => x[0]).slice(-2).join('').toUpperCase();
const hue = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const I = {
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  build: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'
};

async function api(action, payload = {}) {
  const res = await fetch(CONFIG.API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, idToken: S.idToken, ...payload})});
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.message); e.code = j.code; throw e; }
  return j.data;
}
function fail(e) {
  if (e.code === 'AUTH') return signOut();
  if (e.code === 'FORBIDDEN' && !S.me) return renderSignIn(e.message, true);
  alertModal('Something went wrong', e.message || 'Network error. Please try again.');
}
function toast(m) { $$('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
function modal(html, onMount) {
  $('#modal').innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  $('#modal .modal-bg').addEventListener('mousedown', e => { if (e.target.classList.contains('modal-bg')) closeModal(); });
  onMount && onMount($('#modal .modal'));
}
const closeModal = () => $('#modal').innerHTML = '';
function alertModal(title, msg) { modal(`<h2>${esc(title)}</h2><p class="sub">${esc(msg)}</p><div class="acts"><button class="btn primary" data-x>OK</button></div>`, m => $('[data-x]', m).onclick = closeModal); }
function confirmModal(title, msg, yes, label = 'Confirm', danger) {
  modal(`<h2>${esc(title)}</h2><p class="sub">${esc(msg)}</p><div class="acts"><button class="btn" data-n>Cancel</button><button class="btn primary" data-y ${danger ? 'style="background:var(--bad);border-color:var(--bad)"' : ''}>${esc(label)}</button></div>`,
    m => { $('[data-n]', m).onclick = closeModal; $('[data-y]', m).onclick = () => { closeModal(); yes(); }; });
}
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); } catch { toast('Copy failed — select the text and copy manually'); } }

/* ---- learner-side renderers (for previews) ---- */
const DRIVE_ID = /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/;
const YT_ID = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/;
function videoEmbed(cell) {
  return String(cell || '').split(/[\n,]+/).map(s => s.trim()).filter(Boolean).map(url => {
    let m = url.match(YT_ID);
    if (m) return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0" allowfullscreen></iframe></div>`;
    m = url.match(DRIVE_ID);
    if (m) return `<div class="video"><iframe src="https://drive.google.com/file/d/${m[1]}/preview" allowfullscreen></iframe></div>`;
    if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return `<video src="${esc(url)}" controls style="width:100%;border-radius:10px;margin-bottom:12px"></video>`;
    return `<p><a href="${esc(url)}" target="_blank" rel="noopener">▶ ${esc(url)}</a></p>`;
  }).join('');
}
function lessonContent(raw) {
  let s = String(raw || '');
  const driveImg = id => `https://lh3.googleusercontent.com/d/${id}`;
  if (!/<[a-z][\s\S]*>/i.test(s)) {
    s = s.split(/\n\s*\n/).map(block => {
      const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
      if (!lines.length) return '';
      if (lines.length === 1 && /^https?:\/\/\S+$/i.test(lines[0])) {
        const u = lines[0], d = u.match(DRIVE_ID);
        if (d || /\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(u)) return `<img src="${esc(d ? driveImg(d[1]) : u)}" alt="" style="max-width:100%;border-radius:10px;margin:6px 0">`;
      }
      if (lines.every(l => /^[-*•]\s+/.test(l))) return `<ul>${lines.map(l => `<li>${esc(l.replace(/^[-*•]\s+/, ''))}</li>`).join('')}</ul>`;
      return `<p>${lines.map(esc).join('<br>')}</p>`;
    }).join('');
  }
  return s.replace(/(<img[^>]+src=["'])([^"']+)(["'])/gi, (all, a, url, b) => { const d = url.match(DRIVE_ID); return d ? a + driveImg(d[1]) + b : all; });
}

/* =================================================================
   Auth
================================================================= */
function jwtPayload(t) { try { return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch { return null; } }
const tokenValid = t => { const p = t && jwtPayload(t); return p && p.exp * 1000 > Date.now() + 60000; };
async function renderSignIn(msg, forbidden) {
  $('#app').innerHTML = `<div class="signin"><div class="box">
    <div style="width:56px;height:56px;border-radius:16px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px">${forbidden ? '🔒' : '🎓'}</div>
    <h1 style="font-size:22px">${forbidden ? 'No admin access' : esc(CONFIG.ORG_NAME) + ' Admin'}</h1>
    <p class="sub">${forbidden ? esc(msg) : 'Create courses, share links and track results.'}</p>
    <div id="gbtn"></div>${!forbidden && msg ? `<div style="color:var(--bad);font-size:13px">${esc(msg)}</div>` : ''}
    <p class="help" style="margin-top:18px">Only Google accounts listed in the <b>Admins</b> sheet can sign in.</p></div></div>`;
  for (let i = 0; i < 100 && !window.google?.accounts?.id; i++) await new Promise(r => setTimeout(r, 100));
  if (!window.google?.accounts?.id) return alertModal('Error', 'Could not load Google Sign-In. Check your connection.');
  google.accounts.id.initialize({client_id: CONFIG.GOOGLE_CLIENT_ID, auto_select: !forbidden,
    callback: r => { S.idToken = r.credential; try { sessionStorage.setItem('th_admin_tok', S.idToken); } catch {} start(); }});
  if (forbidden) google.accounts.id.disableAutoSelect();
  google.accounts.id.renderButton($('#gbtn'), {theme: 'filled_blue', size: 'large', shape: 'pill', text: forbidden ? 'signin_with' : 'continue_with'});
}
function signOut() {
  S.idToken = null; S.me = null; try { sessionStorage.removeItem('th_admin_tok'); } catch {}
  try { google.accounts.id.disableAutoSelect(); } catch {}
  renderSignIn();
}
async function start() {
  $('#app').innerHTML = '<div class="loading"><div class="spinner"></div>Checking access…</div>';
  try { S.me = await api('adminMe'); go('courses'); } catch (e) { fail(e); }
}

/* =================================================================
   Shell & routing
================================================================= */
function shell(content) {
  const nav = (r, icon, label) => `<button class="nav ${S.route === r || (r === 'courses' && S.route === 'course') ? 'active' : ''}" data-nav="${r}">${icon}${label}</button>`;
  $('#app').innerHTML = `<div class="shell">
    <aside class="side">
      <div class="logo"><svg width="30" height="30" viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="#2563eb"/><path d="M7 11l7-4 7 4-7 4-7-4z" fill="#fff"/><path d="M10 13v4c0 1.5 2 3 4 3s4-1.5 4-3v-4" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
        <div>${esc(CONFIG.ORG_NAME)}<small>Admin console</small></div></div>
      ${nav('courses', I.book, 'Courses')}${nav('depts', I.build, 'Departments')}
      <div class="me"><span style="opacity:.7">Signed in as</span><b title="${esc(S.me.email)}">${esc(S.me.email)}</b><button data-out>Sign out</button></div>
    </aside>
    <main class="main"><div class="page" id="page">${content}</div></main></div>`;
  $$('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
  $('[data-out]').onclick = signOut;
}
const loadingHTML = m => `<div class="loading"><div class="spinner"></div>${esc(m || 'Loading…')}</div>`;
async function go(route, arg) {
  if (S.route === 'builder' && S.dirty && route !== 'builder') {
    return confirmModal('Leave without saving?', 'Your changes to this course will be lost.', () => { S.dirty = false; go(route, arg); }, 'Discard changes', true);
  }
  S.route = route; window.scrollTo(0, 0);
  try {
    if (route === 'courses') { shell(loadingHTML()); S.courses = await api('adminListCourses'); viewCourses(); }
    else if (route === 'course') {
      S.courseId = arg; S.dtab = S.dtab || 'overview'; shell(loadingHTML('Loading dashboard…'));
      const [courses, results, links] = await Promise.all([S.courses.length ? S.courses : api('adminListCourses'),
        api('adminResults', {courseId: arg}), api('adminListLinks', {courseId: arg})]);
      S.courses = courses; S.results = results; S.links = links; viewCourse();
    }
    else if (route === 'builder') {
      $('#app').innerHTML = loadingHTML('Opening editor…');
      if (arg) { S.edit = await api('adminGetCourse', {courseId: arg}); S.isNew = false; }
      if (!S.depts.length) S.depts = await api('adminGetDepartments').catch(() => []);
      S.sel = 'settings'; S.dirty = S.isNew; S.wmode = 'write'; viewBuilder();
    }
    else if (route === 'depts') { shell(loadingHTML()); S.depts = await api('adminGetDepartments'); viewDepts(); }
  } catch (e) { fail(e); }
}
window.addEventListener('beforeunload', e => { if ((S.route === 'builder' && S.dirty) || uploading) { e.preventDefault(); e.returnValue = ''; } });

/* =================================================================
   Courses — card grid
================================================================= */
function viewCourses() {
  const all = S.courses;
  const list = all.filter(c => (S.filter === 'all' || (S.filter === 'active') === c.active) &&
    (!S.q || (c.title + ' ' + c.category + ' ' + c.courseId).toLowerCase().includes(S.q.toLowerCase())));
  const tot = all.reduce((a, c) => ({l: a.l + c.learners, p: a.p + c.passed, k: a.k + c.activeLinks}), {l: 0, p: 0, k: 0});
  shell(`<div class="page-head"><div><h1>Courses</h1><p class="sub">Build courses, share them with a link, and follow your team's progress.</p></div>
      <button class="btn primary" data-new>${I.plus} New course</button></div>
    <div class="kpis">
      <div class="card kpi"><div class="l">📚 Courses</div><div class="v">${all.length}</div><div class="d">${all.filter(c => c.active).length} active</div></div>
      <div class="card kpi"><div class="l">👥 Learners</div><div class="v">${tot.l}</div><div class="d">across all courses</div></div>
      <div class="card kpi"><div class="l">🏅 Completions</div><div class="v">${tot.p}</div><div class="d">${pct(tot.p, tot.l)}% completion rate</div></div>
      <div class="card kpi"><div class="l">🔗 Active links</div><div class="v">${tot.k}</div><div class="d">currently shareable</div></div>
    </div>
    <div class="toolbar">
      <div class="search">${I.search}<input class="input" id="q" placeholder="Search courses…" value="${esc(S.q)}"></div>
      <div class="seg">${[['all', 'All'], ['active', 'Active'], ['archived', 'Archived']].map(([k, l]) => `<button class="${S.filter === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="grid">
      ${S.filter !== 'archived' && !S.q ? `<button class="newcard" data-new><div class="plus">+</div>Create a new course<span class="help" style="font-weight:500">Lessons, images, videos and a quiz</span></button>` : ''}
      ${list.map(courseCard).join('')}
    </div>
    ${!list.length && (S.q || S.filter === 'archived') ? `<div class="empty"><div class="ill">🔎</div>No courses match.</div>` : ''}`);
  $$('[data-new]').forEach(b => b.onclick = newCourseModal);
  const q = $('#q'); q.oninput = () => { S.q = q.value; const p = q.selectionStart; viewCourses(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
  $$('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; viewCourses(); });
  $$('.course').forEach(card => card.onclick = e => { if (!e.target.closest('button')) { S.dtab = 'overview'; go('course', card.dataset.id); } });
  $$('[data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); cardAction(b.dataset.act, b.dataset.id, b); });
  document.addEventListener('click', closeMenus, {once: true});
}
function courseCard(c) {
  const k = cat(c.category), rate = pct(c.passed, c.learners);
  return `<div class="card course" data-id="${esc(c.courseId)}">
    <div class="band" style="background:${k.c}"></div>
    <div class="top"><div class="ico" style="background:${k.bg}">${k.icon}</div>
      <div style="flex:1;min-width:0"><div class="cat">${esc(c.category || 'General')}</div><div class="help" style="margin:0">${c.durationMin ? c.durationMin + ' min' : ''}</div></div>
      ${c.active ? '<span class="badge ok"><span class="dot"></span>Active</span>' : '<span class="badge"><span class="dot"></span>Archived</span>'}</div>
    <div class="title">${esc(c.title)}</div>
    <div class="desc">${esc(c.description) || '<span style="color:var(--faint)">No description</span>'}</div>
    <div class="meta"><span>📄 ${c.lessons} lesson${c.lessons === 1 ? '' : 's'}</span><span>❓ ${c.questions} question${c.questions === 1 ? '' : 's'}</span><span>🔗 ${c.activeLinks} link${c.activeLinks === 1 ? '' : 's'}</span></div>
    <div class="prog"><div class="row"><span><b>${c.passed}</b> of ${c.learners} learner${c.learners === 1 ? '' : 's'} passed</span><b>${rate}%</b></div>
      <div class="bar"><i style="width:${rate}%"></i></div>
      <div class="row" style="margin:7px 0 0"><span>Avg. best score</span><b>${c.avgScore ?? '—'}${c.avgScore != null ? '%' : ''}</b></div></div>
    <div class="foot">
      <span class="sp">${ago(c.lastActivity)}</span>
      <button class="btn sm soft" data-act="dash" data-id="${esc(c.courseId)}">${I.chart} Dashboard</button>
      <button class="btn sm icon" title="Edit" data-act="edit" data-id="${esc(c.courseId)}">${I.edit}</button>
      <button class="btn sm icon" title="Share" data-act="share" data-id="${esc(c.courseId)}" ${c.active ? '' : 'disabled'}>${I.share}</button>
      <button class="btn sm icon" title="More" data-act="more" data-id="${esc(c.courseId)}">${I.more}</button>
    </div></div>`;
}
function closeMenus() { $$('.menu').forEach(m => m.remove()); }
function cardAction(act, id, btn) {
  const c = S.courses.find(x => x.courseId === id);
  if (act === 'dash') { S.dtab = 'overview'; go('course', id); }
  else if (act === 'edit') go('builder', id);
  else if (act === 'share') shareModal(id);
  else if (act === 'more') {
    closeMenus();
    const m = document.createElement('div'); m.className = 'menu';
    m.innerHTML = `<button data-m="links">🔗 Manage links</button><button data-m="learners">👥 View learners</button>
      <button data-m="toggle">${c.active ? '🗄️ Archive course' : '♻️ Restore course'}</button>`;
    btn.closest('.course').appendChild(m);
    m.onclick = e => { e.stopPropagation(); const k = e.target.closest('[data-m]')?.dataset.m; closeMenus();
      if (k === 'links') { S.dtab = 'links'; go('course', id); }
      if (k === 'learners') { S.dtab = 'learners'; go('course', id); }
      if (k === 'toggle') toggleActive(c, () => viewCourses()); };
    setTimeout(() => document.addEventListener('click', closeMenus, {once: true}));
  }
}
function toggleActive(c, after) {

function makeId(title) {
  const base = title.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) || 'COURSE';
  let id = base, n = 2; while (S.courses.some(c => c.courseId === id)) id = `${base}-${n++}`;
  return id;
}

const lessonOk = l => l.title.trim() && (l.content.trim() || l.videoUrl.trim());
const questionIssue = q => { const o = q.options.map(x => x.trim()); if (!q.question.trim()) return 'Question text is empty';
  if (o.filter(Boolean).length < 2) return 'Needs at least 2 options'; if (!o[KEYS.indexOf(q.correct)]) return 'Pick the correct answer'; return null; };
function issues() {
  const c = S.edit, out = [];
  if (!c.title.trim()) out.push(['settings', 'Course title is missing']);
  if (!/^[A-Za-z0-9_-]{2,30}$/.test(c.courseId)) out.push(['settings', 'Course ID is invalid']);
  c.lessons.forEach((l, i) => { if (!l.title.trim()) out.push(['l' + i, `Lesson ${i + 1} needs a title`]); else if (!lessonOk(l)) out.push(['l' + i, `Lesson ${i + 1} has no content`]); });
  c.questions.forEach((q, i) => { const p = questionIssue(q); if (p) out.push(['quiz', `Q${i + 1}: ${p}`]); });
  return out;
}

/* ---- Uploads ---- */
let uploading = 0;
async function resizeImage(file) {
  if (file.type === 'image/gif') return {blob: file, type: 'image/gif'};
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  const type = file.type === 'image/png' && file.size < 1.5e6 ? 'image/png' : 'image/jpeg';
  return {blob: await new Promise(r => cv.toBlob(r, type, 0.85)), type};
}
async function uploadImage(i, file) {
  if (!/^image\//.test(file.type)) return alertModal('Not an image', 'Please choose a PNG, JPG, GIF or WEBP file.');
  const l = S.edit.lessons[i], host = $('#iprog'), pb = host && progressBox(host, `Uploading ${file.name}…`);
  uploading++;
  try {
    pb && pb.set(30);
    const {blob, type} = await resizeImage(file);
    if (blob.size > 8e6) throw new Error('Image is still larger than 8 MB after resizing.');
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
    pb && pb.set(60);
    const r = await api('adminUploadImage', {fileName: file.name, mimeType: type, dataBase64: b64});
    const ta = $('#ltext');
    if (ta && S.sel === 'l' + i) insertText(ta, `\n\n${r.url}\n\n`);
    else { l.content = (l.content.trim() ? l.content.trim() + '\n\n' : '') + r.url + '\n'; markDirty(); }
    pb && (pb.set(100, '✓ Image added'), pb.done());
  } catch (e) { pb && pb.el.remove(); fail(e); }
  finally { uploading--; }
}
async function uploadVideo(i, file) {
  if (!/^video\//.test(file.type)) return alertModal('Not a video', 'Please choose a video file (MP4, MOV, WEBM…).');
  if (file.size > 2 * 1024 ** 3) return alertModal('Video too large', 'Maximum 2 GB. For long videos, YouTube (Unlisted) works better.');
  const l = S.edit.lessons[i], mb = (file.size / 1048576).toFixed(1);
  const pb = progressBox($('#vprog'), `Preparing ${file.name} (${mb} MB)…`);
  uploading++;
  try {
    const {uploadUrl} = await api('adminStartVideoUpload', {fileName: file.name, mimeType: file.type, size: file.size, origin: location.origin});
    const fileId = await new Promise((resolve, reject) => {
      const x = new XMLHttpRequest(); x.open('PUT', uploadUrl); x.setRequestHeader('Content-Type', file.type);
      x.upload.onprogress = e => { if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); pb.set(p, `Uploading ${file.name} — ${p}% of ${mb} MB · keep this page open`); } };
      x.onload = () => { if (x.status === 200 || x.status === 201) { try { resolve(JSON.parse(x.responseText).id); } catch { reject(new Error('Unexpected response from Drive.')); } } else reject(new Error(`Drive upload failed (${x.status}).`)); };
      x.onerror = () => reject(new Error('Network error during upload. Please try again.'));
      x.send(file);
    });
    pb.set(100, 'Finishing…');
    const r = await api('adminFinishUpload', {fileId});
    l.videoUrl = (l.videoUrl.trim() ? l.videoUrl.trim() + '\n' : '') + r.url; markDirty();
    if (S.sel === 'l' + i) edLesson(i);
    toast('Video uploaded — Drive may need a few minutes to process it');
  } catch (e) { pb.el.remove(); fail(e); }
  finally { uploading--; }
}

      q.showN = Math.min(4, cur + 1); rerender(); $$(`.qcard[data-q="${i}"] [data-o]`).pop().focus();
    };
    $$('[data-qa]', card).forEach(b => b.onclick = () => {
      const a = b.dataset.qa;
      if (a === 'up' || a === 'down') { const j = i + (a === 'up' ? -1 : 1); [qs[i], qs[j]] = [qs[j], qs[i]]; markDirty(); edQuiz(); }
      if (a === 'dup') { qs.splice(i + 1, 0, JSON.parse(JSON.stringify(q))); markDirty(); edQuiz(); }
      if (a === 'del') { if (qs.length === 1) return alertModal('Cannot delete', 'A quiz needs at least one question.');
        confirmModal('Delete this question?', `Q${i + 1} will be removed when you save.`, () => { qs.splice(i, 1); markDirty(); edQuiz(); }, 'Delete', true); }
    });
  });
}
function updBadge(card, q) { const b = $('.qh .badge', card), p = questionIssue(q); b.className = 'badge ' + (p ? 'warn' : 'ok'); b.textContent = p || '✓ Ready'; }

/* ---- Save ---- */
async function saveCourse() {
  const iss = issues();
  if (iss.length) {
    S.sel = iss[0][0]; refreshOutline(); renderEditor();
    return alertModal('Almost there', iss.length === 1 ? iss[0][1] + '.' : `${iss.length} things need attention — see the checklist on the left. First: ${iss[0][1]}.`);
  }
  if (uploading) return alertModal('Upload in progress', 'Please wait for uploads to finish before saving.');
  const btn = $('[data-save]'); btn.disabled = true; btn.innerHTML = 'Saving…';
  const c = S.edit, payload = {...c, questions: c.questions.map(({showN, ...q}) => q)};
  try {
    await api('adminSaveCourse', {course: payload, isNew: S.isNew});
    const wasNew = S.isNew; S.isNew = false; S.dirty = false;
    S.courses = await api('adminListCourses');
    viewBuilder(); toast('Course saved');
    if (wasNew) modal(`<div style="text-align:center"><div style="font-size:44px">🎉</div><h2>Your course is live!</h2><p class="sub">Create a share link so your team can start learning.</p>
      <div class="acts" style="justify-content:center"><button class="btn" data-n>Keep editing</button><button class="btn" data-d>Open dashboard</button><button class="btn primary" data-y>${I.share} Create share link</button></div></div>`, m => {
        $('[data-n]', m).onclick = closeModal;
        $('[data-d]', m).onclick = () => { closeModal(); S.dtab = 'overview'; go('course', c.courseId); };
        $('[data-y]', m).onclick = () => shareModal(c.courseId);
      });
  } catch (e) { btn.disabled = false; btn.innerHTML = `${I.save} Save`; fail(e); }
}

/* =================================================================
   Departments
================================================================= */
function viewDepts() {
  shell(`<div class="page-head"><div><h1>Departments</h1><p class="sub">Learners pick one of these after signing in. Used to group results.</p></div></div>
    <div class="card pad" style="max-width:620px">
      <div style="display:flex;gap:8px"><input class="input" id="dnew" placeholder="Add a department, e.g. Warehouse"><button class="btn primary" id="dadd">${I.plus} Add</button></div>
      <div id="dlist" style="margin-top:14px"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" id="dsave">${I.save} Save changes</button></div></div>`);
  const list = [...S.depts];
  const draw = () => {
    $('#dlist').innerHTML = list.length ? list.map((d, i) => `<div class="mitem" style="margin-bottom:8px"><span class="k">🏢</span><input class="u" data-di="${i}" value="${esc(d)}" style="border:0;outline:none;background:transparent">
      <button class="btn sm ghost danger" data-dr="${i}">${I.trash}</button></div>`).join('') : '<div class="empty" style="padding:24px">No departments — learners will type their own.</div>';
    $$('[data-di]').forEach(inp => inp.oninput = () => list[+inp.dataset.di] = inp.value);
    $$('[data-dr]').forEach(b => b.onclick = () => { list.splice(+b.dataset.dr, 1); draw(); });
  };
  draw();
  const add = () => { const v = $('#dnew').value.trim(); if (!v) return; list.push(v); $('#dnew').value = ''; draw(); $('#dnew').focus(); };
  $('#dadd').onclick = add; $('#dnew').onkeydown = e => { if (e.key === 'Enter') add(); };
  $('#dsave').onclick = async () => { try { S.depts = await api('adminSaveDepartments', {departments: list}); viewDepts(); toast('Departments saved'); } catch (e) { fail(e); } };
}

/* =================================================================
   Boot
================================================================= */
(function boot() {
  if (CONFIG.API_URL.includes('XXXX') || CONFIG.GOOGLE_CLIENT_ID.includes('XXXX'))
    return $('#app').innerHTML = '<div class="signin"><div class="box"><h1 style="font-size:20px">Not configured</h1><p class="sub">Set API_URL and GOOGLE_CLIENT_ID at the top of admin.html.</p></div></div>';
  let t = null; try { t = sessionStorage.getItem('th_admin_tok'); } catch {}
  if (tokenValid(t)) { S.idToken = t; start(); } else renderSignIn();
})();
</script>
