<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ======== CONFIG — fill these in (see README) ======== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/XXXXXXXXXXXX/exec',   // Apps Script web app URL
  GOOGLE_CLIENT_ID: 'XXXXXXXXXXXX.apps.googleusercontent.com',       // OAuth Web client ID
  ORG_NAME: 'Training Hub'
};
</script>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#1a2233;--muted:#5d6b82;--line:#e3e8ef;--brand:#0b5cad;--brand-2:#e8f1fb;
--ok:#1f8a4c;--ok-2:#e5f5ec;--warn:#b26a00;--warn-2:#fdf3e1;--bad:#c0392b;--bad-2:#fbeaea;--r:10px;
--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button{font:inherit;cursor:pointer}input,select{font:inherit;color:inherit}
header{background:#0f1f36;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
header .brand{font-weight:700;display:flex;align-items:center;gap:10px}
header .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#c9d4e5}
header .who img{width:28px;height:28px;border-radius:50%}
header .who button{background:none;border:1px solid #2d4b78;color:#c9d4e5;border-radius:6px;padding:3px 10px;font-size:12px}
main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.center{max-width:460px;margin:40px auto;text-align:center}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:#c4cdd9}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover:not(:disabled){background:#094c8f}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;text-align:left}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.field input:focus,.field select:focus{outline:2px solid var(--brand-2);border-color:var(--brand)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--brand-2);color:var(--brand)}
.pill.ok{background:var(--ok-2);color:var(--ok)}.pill.bad{background:var(--bad-2);color:var(--bad)}.pill.warn{background:var(--warn-2);color:var(--warn)}
.hero{border-radius:var(--r);padding:22px;color:#fff;background:linear-gradient(135deg,#0b5cad,#0f1f36);margin-bottom:16px}
.hero .cat{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero h1{color:#fff;margin:4px 0}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;opacity:.9;margin-top:8px}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:#fff}
.player{display:grid;grid-template-columns:270px 1fr;gap:16px}
.lessons{padding:8px}
.lesson{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;border:0;background:none;width:100%;text-align:left}
.lesson:hover:not(:disabled){background:var(--bg)}.lesson.active{background:var(--brand-2);color:var(--brand);font-weight:600}
.lesson:disabled{opacity:.5;cursor:not-allowed}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #c4cdd9;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.dot.done{background:var(--ok);border-color:var(--ok)}
.content .body{min-height:220px}.content .body img{max-width:100%}
.video{position:relative;padding-top:56.25%;margin-bottom:14px;border-radius:8px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.navrow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.q{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:#fff}
.opt{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:6px;margin-top:6px;border:1px solid var(--line);cursor:pointer}
.opt:hover{background:var(--bg)}.opt input{margin:0}
.q.right{border-color:var(--ok);background:var(--ok-2)}.q.wrong{border-color:var(--bad);background:var(--bad-2)}
.timer{position:sticky;top:0;z-index:2;background:var(--warn-2);color:var(--warn);font-weight:600;padding:8px 14px;border-radius:8px;margin-bottom:12px;display:flex;justify-content:space-between}
.timer.low{background:var(--bad-2);color:var(--bad)}
.score{font-size:48px;font-weight:700;margin:6px 0}
.cert{max-width:720px;margin:20px auto;text-align:center;padding:44px 36px;border:8px double #c9a64a;background:#fffdf6}
.cert .t{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#8a6d1f}
.cert .name{font-size:30px;font-weight:700;margin:14px 0 2px}
.cert .course{font-size:19px;font-weight:600;color:var(--brand);margin:8px 0 18px}
.cert .grid{display:flex;justify-content:space-around;font-size:13px;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(15,31,54,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:20px}
#gbtn{display:flex;justify-content:center;margin:18px 0 6px}
@media(max-width:780px){.player{grid-template-columns:1fr}main{padding:16px 12px 40px}}
@media print{header,.noprint{display:none!important}body{background:#fff}.cert{margin:0 auto}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg width="26" height="26" viewBox="0 0 28 28"><rect width="28" height="28" rx="7" fill="#0b5cad"/><path d="M7 11l7-4 7 4-7 4-7-4z" fill="#fff"/><path d="M10 13v4c0 1.5 2 3 4 3s4-1.5 4-3v-4" stroke="#fff" stroke-width="1.6" fill="none"/></svg><span id="orgName"></span></div>
  <div class="who" id="who"></div>
</header>
<main id="main"></main>
<div id="modal"></div>

<script>
/* =================== State =================== */
const S = {
  token: new URLSearchParams(location.search).get('c') || '',
  idToken: null, session: null, lessonIdx: 0, lessonStart: 0,
  quiz: null, answers: {}, timerId: null, result: null, view: 'loading'
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = iso => iso ? new Date(iso).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}) : '';
document.getElementById('orgName').textContent = CONFIG.ORG_NAME;

/* =================== API =================== */
async function api(action, payload = {}) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},  // text/plain avoids a CORS preflight
    body: JSON.stringify({action, token: S.token, idToken: S.idToken, ...payload})
  });
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.message); e.code = j.code; throw e; }
  return j.data;
}
function handleError(e) {
  if (e.code === 'AUTH') { signOut(false); showSignIn(e.message); return; }
  if (e.code === 'LINK' || e.code === 'COURSE') { render(fatal(e.message)); return; }
  if (e.code === 'PROFILE') { S.view = 'profile'; draw(); return; }
  toastModal('Something went wrong', e.message || 'Network error. Please check your connection and try again.');
}

/* =================== Google Sign-In =================== */
function jwtPayload(t) { try { return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))))); } catch { return null; } }
function tokenValid(t) { const p = t && jwtPayload(t); return p && p.exp * 1000 > Date.now() + 60000; }
function waitForGoogle() {
  return new Promise((resolve, reject) => {
    let n = 0; const t = setInterval(() => {
      if (window.google?.accounts?.id) { clearInterval(t); resolve(); }
      else if (++n > 100) { clearInterval(t); reject(new Error('Could not load Google Sign-In. Check your connection.')); }
    }, 100);
  });
}
async function showSignIn(msg) {
  let info = null;
  try { info = await api('linkInfo'); } catch (e) { if (e.code === 'LINK' || e.code === 'COURSE') return render(fatal(e.message)); }
  render(`<div class="card center">
    <div style="font-size:40px">🎓</div>
    <h1>${esc(info?.title || 'Training course')}</h1>
    <p class="sub">${info ? `${esc(info.category)} · ${info.durationMin} min<br>Link valid until ${esc(fmtDate(info.expiresAt))}` : ''}</p>
    <p>Sign in with your Google account to start. Your progress and quiz results will be saved.</p>
    <div id="gbtn"></div>
    <div class="err">${esc(msg || '')}</div>
    <p style="font-size:12px;color:var(--muted);margin-top:16px">We only use your Google email to identify you. You'll enter your name and department on the next step.</p>
  </div>`);
  try {
    await waitForGoogle();
    google.accounts.id.initialize({client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: false});
    google.accounts.id.renderButton($('#gbtn'), {theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill'});
  } catch (e) { $('.err').textContent = e.message; }
}
function onCredential(resp) {
  S.idToken = resp.credential;
  try { sessionStorage.setItem('th_idToken', S.idToken); } catch {}
  loadSession();
}
function signOut(reload = true) {
  S.idToken = null; S.session = null;
  try { sessionStorage.removeItem('th_idToken'); } catch {}
  try { google.accounts.id.disableAutoSelect(); } catch {}
  $('#who').innerHTML = '';
  if (reload) showSignIn();
}

/* =================== Flow =================== */
async function boot() {
  if (!S.token) return render(fatal('This page needs a training link. Please open the link you received from HR / your supervisor.'));
  if (CONFIG.API_URL.includes('XXXX') || CONFIG.GOOGLE_CLIENT_ID.includes('XXXX')) return render(fatal('Site not configured: set API_URL and GOOGLE_CLIENT_ID in index.html.'));
  let saved = null; try { saved = sessionStorage.getItem('th_idToken'); } catch {}
  if (tokenValid(saved)) { S.idToken = saved; loadSession(); } else showSignIn();
}
async function loadSession() {
  render(loading('Loading your course…'));
  try {
    S.session = await api('session');
    const p = jwtPayload(S.idToken) || {};
    $('#who').innerHTML = `${p.picture ? `<img src="${esc(p.picture)}" alt="">` : ''}<span>${esc(S.session.user.profile?.fullName || S.session.user.email)}</span><button id="outBtn">Sign out</button>`;
    $('#outBtn').onclick = () => signOut();
    if (!S.session.user.profile) S.view = 'profile';
    else if (S.session.attempts.passed) S.view = 'done';
    else S.view = 'course';
    S.lessonIdx = firstUnviewed();
    draw();
  } catch (e) { handleError(e); }
}
function firstUnviewed() {
  const n = S.session.course.lessons.length, seen = new Set(S.session.progress);
  for (let i = 0; i < n; i++) if (!seen.has(i)) return i;
  return Math.max(0, n - 1);
}
function draw() {
  const v = {profile: viewProfile, course: viewCourse, quiz: viewQuiz, result: viewResult, done: viewDone, cert: viewCert}[S.view];
  render(v ? v() : loading());
  bind();
}
function render(html) { $('#main').innerHTML = html; window.scrollTo(0, 0); }
const loading = (m = 'Loading…') => `<div class="center"><div class="spinner"></div><div style="color:var(--muted)">${esc(m)}</div></div>`;
const fatal = m => `<div class="card center"><div style="font-size:40px">⏳</div><h1>Link unavailable</h1><p class="sub">${esc(m)}</p><p style="font-size:13px;color:var(--muted)">Please contact HR or your supervisor for a new link.</p></div>`;
function toastModal(title, msg, onOk) {
  $('#modal').innerHTML = `<div class="modal-bg"><div class="modal"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div style="text-align:right"><button class="btn primary" id="mOk">OK</button></div></div></div>`;
  $('#mOk').onclick = () => { $('#modal').innerHTML = ''; onOk && onOk(); };
}
function confirmModal(title, msg, yes) {
  $('#modal').innerHTML = `<div class="modal-bg"><div class="modal"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="mNo">Cancel</button><button class="btn primary" id="mYes">Confirm</button></div></div></div>`;
  $('#mNo').onclick = () => $('#modal').innerHTML = '';
  $('#mYes').onclick = () => { $('#modal').innerHTML = ''; yes(); };
}

/* =================== Views =================== */
function viewProfile() {
  const s = S.session, p = s.user.profile;
  const depts = s.departments;
  const deptField = depts.length
    ? `<select id="pDept"><option value="">— Select your department —</option>${depts.map(d => `<option ${p?.department === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select>`
    : `<input id="pDept" value="${esc(p?.department || '')}" placeholder="e.g. Production">`;
  return `<div class="card center" style="text-align:left">
    <h1 style="text-align:center">${p ? 'Edit your details' : 'Welcome! 👋'}</h1>
    <p class="sub" style="text-align:center">Signed in as <b>${esc(s.user.email)}</b>. Please enter your details — they will appear on your certificate.</p>
    <form id="pForm">
      <div class="field"><label for="pName">Full name *</label><input id="pName" maxlength="100" autocomplete="name" value="${esc(p?.fullName || s.user.googleName || '')}" required></div>
      <div class="field"><label for="pDept">Department *</label>${deptField}</div>
      <div class="err" id="pErr"></div>
      <button class="btn primary" style="width:100%" type="submit" id="pSave">${p ? 'Save' : 'Continue to course'}</button>
      ${p ? `<button class="btn" style="width:100%;margin-top:8px" type="button" data-go="course">Cancel</button>` : ''}
    </form></div>`;
}
function hero() {
  const c = S.session.course, a = S.session.attempts;
  const pct = Math.round(S.session.progress.length / (c.lessons.length || 1) * 100);
  return `<div class="hero">
    <div class="cat">${esc(c.category)}</div><h1>${esc(c.title)}</h1><div style="opacity:.9">${esc(c.description || '')}</div>
    <div class="meta"><span>⏱ ${c.durationMin} min</span><span>📄 ${c.lessons.length} lessons</span><span>📝 ${c.questionCount} questions</span>
     <span>✅ Pass ${c.passScore}%</span>${c.timeLimitMin ? `<span>⏳ Quiz ${c.timeLimitMin} min</span>` : ''}
     ${a.max ? `<span>🔁 Attempts ${a.count}/${a.max}</span>` : ''}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div style="font-size:12px;margin-top:4px;opacity:.85">${pct}% of lessons completed · Link valid until ${esc(fmtDate(S.session.linkExpiresAt))}</div></div>`;
}
function videoEmbed(url) {
  if (!url) return '';
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  return `<p><a href="${esc(url)}" target="_blank" rel="noopener">▶ Open video</a></p>`;
}
function viewCourse() {
  const c = S.session.course, seen = new Set(S.session.progress), i = S.lessonIdx, L = c.lessons[i];
  const allDone = seen.size >= c.lessons.length;
  const a = S.session.attempts, noAttempts = a.remaining === 0 || a.passed;
  S.lessonStart = Date.now();
  return `${hero()}
  <div class="player">
    <div class="card lessons">
      ${c.lessons.map((l, k) => `<button class="lesson ${k === i ? 'active' : ''}" data-lesson="${k}" ${k > 0 && !seen.has(k - 1) && !seen.has(k) && k !== i ? 'disabled' : ''}>
        <span class="dot ${seen.has(k) ? 'done' : ''}">${seen.has(k) ? '✓' : ''}</span>${esc(l.title)}</button>`).join('')}
      <button class="lesson" id="toQuiz" ${allDone && !noAttempts ? '' : 'disabled'}><span class="dot"></span>📝 Final quiz</button>
      <div style="padding:8px 10px;font-size:12px;color:var(--muted)">
        ${a.passed ? '✅ You already passed this course.' : noAttempts ? 'No quiz attempts remaining — contact HR.' : allDone ? 'All lessons done — you can take the quiz.' : 'Finish all lessons to unlock the quiz.'}
        ${a.count && !a.passed ? `<br>Best score so far: <b>${a.best}%</b>` : ''}</div>
      <div style="padding:0 10px 8px"><button class="btn" style="font-size:12px;padding:4px 10px" data-go="profile">Edit my details</button></div>
    </div>
    <div class="card content">
      ${L ? `<div style="font-size:12px;color:var(--muted)">Lesson ${i + 1} of ${c.lessons.length}</div>
      <h2 style="font-size:20px;margin-top:4px">${esc(L.title)}</h2>
      <div class="body">${videoEmbed(L.videoUrl)}${L.content}</div>
      <div class="navrow">
        <button class="btn" data-lesson="${i - 1}" ${i === 0 ? 'disabled' : ''}>← Previous</button>
        <button class="btn primary" id="completeBtn">${i < c.lessons.length - 1 ? 'Mark complete & next →' : allDone ? (a.passed ? 'Finish review ✓' : 'Go to quiz →') : 'Mark complete →'}</button>
      </div>` : '<p>This course has no lessons yet.</p>'}
    </div>
  </div>`;
}
function viewQuiz() {
  const q = S.quiz;
  return `<h1>${esc(S.session.course.title)} — Final Quiz</h1>
  <p class="sub">${q.questions.length} questions · Pass score ${S.session.course.passScore}%</p>
  ${q.timeLimitMin ? `<div class="timer" id="timer"><span>⏳ Time remaining</span><span id="tLeft">--:--</span></div>` : ''}
  <form id="qForm">
    ${q.questions.map((x, n) => `<div class="q"><b>${n + 1}. ${esc(x.question)}</b>
      ${x.options.map(o => `<label class="opt"><input type="radio" name="q${x.id}" value="${o.key}" ${S.answers[x.id] === o.key ? 'checked' : ''}> ${esc(o.text)}</label>`).join('')}</div>`).join('')}
    <button class="btn primary" type="submit" id="qSubmit">Submit answers</button>
  </form>`;
}
function viewResult() {
  const r = S.result, q = S.quiz, byId = Object.fromEntries(r.results.map(x => [x.id, x]));
  return `<div class="card" style="text-align:center;margin-bottom:16px;border-top:5px solid ${r.passed ? 'var(--ok)' : 'var(--bad)'}">
    <div style="font-size:40px">${r.passed ? '🎉' : '📘'}</div>
    <h1>${r.passed ? 'Congratulations, you passed!' : r.late ? 'Time limit exceeded' : 'Not passed this time'}</h1>
    <div class="score" style="color:${r.passed ? 'var(--ok)' : 'var(--bad)'}">${r.score}%</div>
    <p class="sub">${r.correct} of ${r.total} correct · Pass score ${r.passScore}% · Attempt ${r.attemptNo}${r.attempts.max ? ` of ${r.attempts.max}` : ''}</p>
    <div class="noprint" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      ${r.passed ? `<button class="btn primary" data-go="cert">View certificate</button>`
        : r.attempts.remaining === 0 ? `<span class="pill bad">No attempts remaining — please contact HR</span>`
        : `<button class="btn" data-go="course">Review lessons</button><button class="btn primary" id="retryBtn">Retry quiz</button>`}
    </div></div>
  <h2>Your answers</h2>
  ${q.questions.map((x, n) => { const res = byId[x.id]; const given = x.options.find(o => o.key === S.answers[x.id]);
    return `<div class="q ${res.correct ? 'right' : 'wrong'}"><b>${n + 1}. ${esc(x.question)}</b>
      <div style="margin-top:6px;font-size:14px">${res.correct ? '✅' : '❌'} Your answer: ${given ? esc(given.text) : '<i>not answered</i>'}</div></div>`; }).join('')}`;
}
function viewDone() {
  const a = S.session.attempts;
  return `${hero()}<div class="card" style="text-align:center">
    <div style="font-size:40px">🏅</div><h1>You have completed this course</h1>
    <p class="sub">Passed on ${esc(fmtDate(a.passedAt))} with ${a.passedScore}%.</p>
    <div style="display:flex;gap:8px;justify-content:center"><button class="btn" data-go="course">Review lessons</button><button class="btn primary" data-go="cert">View certificate</button></div></div>`;
}
function viewCert() {
  const s = S.session, p = s.user.profile, a = s.attempts;
  const date = a.passedAt || new Date().toISOString(), score = a.passedScore ?? S.result?.score;
  return `<div class="noprint" style="display:flex;gap:8px;justify-content:space-between;margin-bottom:6px">
    <button class="btn" data-go="${a.passed ? 'done' : 'result'}">← Back</button><button class="btn primary" id="printBtn">🖨 Print / Save as PDF</button></div>
  <div class="cert"><div class="t">Certificate of Completion</div>
    <div style="margin-top:22px;color:var(--muted)">This certifies that</div>
    <div class="name">${esc(p.fullName)}</div><div style="color:var(--muted)">${esc(p.department)}</div>
    <div style="color:var(--muted);margin-top:14px">has successfully completed</div>
    <div class="course">${esc(s.course.title)}</div>
    <div class="grid"><div><b style="color:var(--ink)">${esc(new Date(date).toLocaleDateString())}</b><br>Date</div>
      <div><b style="color:var(--ink)">${score}%</b><br>Score</div><div><b style="color:var(--ink)">${s.course.durationMin} min</b><br>Duration</div></div>
    <div style="margin-top:22px;font-size:11px;color:var(--muted)">${esc(s.user.email)} · ${esc(CONFIG.ORG_NAME)}</div></div>`;
}

/* =================== Actions =================== */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function completeLesson() {
  const c = S.session.course, i = S.lessonIdx, btn = $('#completeBtn');
  const secs = Math.round((Date.now() - S.lessonStart) / 1000);
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = await api('lessonViewed', {lessonIndex: i, seconds: secs});
    S.session.progress = r.progress;
    if (i < c.lessons.length - 1) { S.lessonIdx = i + 1; draw(); }
    else if (r.progress.length >= c.lessons.length) startQuiz();
    else { S.lessonIdx = firstUnviewed(); draw(); }
  } catch (e) { btn.disabled = false; handleError(e); draw(); }
}
async function startQuiz() {
  render(loading('Preparing your quiz…'));
  try {
    const q = await api('startQuiz');
    q.questions = shuffle(q.questions).map(x => ({...x, options: shuffle(x.options)}));
    S.quiz = q; S.answers = {}; S.result = null; S.view = 'quiz'; draw();
    startTimer();
  } catch (e) { S.view = 'course'; draw(); handleError(e); }
}
function startTimer() {
  clearInterval(S.timerId);
  const lim = S.quiz.timeLimitMin; if (!lim) return;
  const end = Date.now() + lim * 60000;   // local clock; the server enforces the real limit
  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000)), el = $('#tLeft');
    if (el) { el.textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`; $('#timer').classList.toggle('low', left <= 60); }
    if (left === 0) { clearInterval(S.timerId); submitQuiz(true); }
  };
  tick(); S.timerId = setInterval(tick, 1000);
}
async function submitQuiz(auto = false) {
  const unanswered = S.quiz.questions.filter(x => !S.answers[x.id]).length;
  const go = async () => {
    clearInterval(S.timerId);
    render(loading('Submitting and grading…'));
    try {
      S.result = await api('submitQuiz', {answers: S.answers});
      S.session.attempts = S.result.attempts;
      S.view = 'result'; draw();
    } catch (e) { S.view = 'quiz'; draw(); handleError(e); }
  };
  if (auto) { toastModal('Time is up', 'Your answers are being submitted automatically.'); return go(); }
  if (unanswered) confirmModal('Submit quiz?', `You have ${unanswered} unanswered question(s). Unanswered questions are marked wrong.`, go);
  else go();
}
async function saveProfile(e) {
  e.preventDefault();
  const fullName = $('#pName').value.trim(), department = $('#pDept').value.trim();
  if (fullName.length < 2) return $('#pErr').textContent = 'Please enter your full name.';
  if (!department) return $('#pErr').textContent = 'Please select your department.';
  $('#pSave').disabled = true; $('#pSave').textContent = 'Saving…';
  try {
    const r = await api('saveProfile', {fullName, department});
    S.session.user.profile = r.profile;
    $('#who span').textContent = r.profile.fullName;
    S.view = S.session.attempts.passed ? 'done' : 'course'; draw();
  } catch (err) { $('#pSave').disabled = false; $('#pSave').textContent = 'Continue'; $('#pErr').textContent = err.message; }
}

/* =================== Event binding =================== */
function bind() {
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.view = b.dataset.go; draw(); });
  document.querySelectorAll('[data-lesson]').forEach(b => b.onclick = () => { const i = +b.dataset.lesson; if (i >= 0) { S.lessonIdx = i; S.view = 'course'; draw(); } });
  const f = $('#pForm'); if (f) f.onsubmit = saveProfile;
  const cb = $('#completeBtn'); if (cb) cb.onclick = () => {
    const c = S.session.course, seen = new Set(S.session.progress);
    if (S.lessonIdx === c.lessons.length - 1 && seen.size >= c.lessons.length) {
      if (S.session.attempts.passed) { S.view = 'done'; draw(); } else startQuiz();
    } else completeLesson();
  };
  const tq = $('#toQuiz'); if (tq) tq.onclick = startQuiz;
  const qf = $('#qForm'); if (qf) {
    qf.onchange = e => { if (e.target.name) S.answers[e.target.name.slice(1)] = e.target.value; };
    qf.onsubmit = e => { e.preventDefault(); submitQuiz(false); };
  }
  const rb = $('#retryBtn'); if (rb) rb.onclick = startQuiz;
  const pb = $('#printBtn'); if (pb) pb.onclick = () => window.print();
}
window.addEventListener('beforeunload', e => { if (S.view === 'quiz') { e.preventDefault(); e.returnValue = ''; } });
boot();
</script>
